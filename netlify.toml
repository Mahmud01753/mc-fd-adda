# শুধু Netlify পড়ে (বাকি হোস্ট এই ফাইল উপেক্ষা করে)। sql/ ও private-notes/ ওয়েবে খুললে 404 দেখাবে।
[[redirects]]
  from = "/sql/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/private-notes/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/START-HERE.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/READ-ME-FIRST-AI.txt"
  to = "/404.html"
  status = 404
  force = true
